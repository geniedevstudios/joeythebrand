<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f4f2ef;
      }
      .container {
        background: #ffffff;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      }
      .header { text-align: center; margin-bottom: 28px; }
      .logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #272b36;
        margin-bottom: 8px;
      }
      .title {
        font-size: 22px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 8px;
      }
      .content { margin: 24px 0; color: #374151; font-size: 15px; }
      .btn-wrap { text-align: center; margin: 32px 0; }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #3d424d 0%, #917e71 100%);
        color: #ffffff !important;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
      }
      .footer {
        text-align: center;
        margin-top: 32px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
        color: #6b7280;
        font-size: 13px;
      }
      .muted { font-size: 12px; color: #9ca3af; word-break: break-all; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">JOEY THE BRAND</div>
        <div class="title">Confirm your email</div>
      </div>

      <div class="content">
        <p>Hello,</p>
        <p>Thanks for signing up. Tap the button below to confirm your email address.</p>
      </div>

      <div class="btn-wrap">
        <a class="btn" href="{{ .ConfirmationURL }}" target="_blank" rel="noopener">Confirm email</a>
      </div>

      <div class="content">
        <p class="muted">If the button doesn’t work, paste this link into your browser:<br>{{ .ConfirmationURL }}</p>
      </div>

      <div class="footer">
        <p>— JOEY THE BRAND</p>
        <p>{{ .Email }}</p>
      </div>
    </div>
  </body>
</html>
